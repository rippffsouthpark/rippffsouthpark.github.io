<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmolLM2 360M — Local</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         background: #111318; color: #e6e6e6; font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 8px 14px; border-bottom: 1px solid #262a33; background: #171a21; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  #stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: #9aa3b2; }
  #loadbar { display: none; height: 4px; background: #262a33; margin-top: 6px; border-radius: 2px; overflow: hidden; }
  #loadfill { height: 100%; width: 0%; background: #4f8cff; transition: width .2s; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2b4a7a; }
  .msg.assistant { align-self: flex-start; background: #232733; }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #262a33; background: #171a21; }
  #input { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 10px;
           border-radius: 8px; border: 1px solid #333a47; background: #111318; color: inherit; font: inherit; }
  button { padding: 0 16px; border-radius: 8px; border: none; background: #4f8cff; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #clear { background: #333a47; }
  .msg.assistant.typing::after { content: "▌"; animation: cursor-blink 0.9s steps(1) infinite; }
@keyframes cursor-blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <!-- MUST be the first script, and MUST be your own file (not a CDN) -->
  <script src="coi-serviceworker.js"></script>

  <header>
    <h1>Gemma 3 (1 Billion Parameters) — Local Browser AI</h1>
    <div id="stats">
      <span id="status">Starting…</span>
      <span>Backend: <span id="backend">WASM/CPU</span></span>
      <span>JS heap: <span id="ram">—</span></span>
      <span>Storage: <span id="storage">—</span></span>
      <span>Last output: <span id="speed">—</span></span>
      <span>All-time est.: <span id="cost">$0.0000</span></span>
    </div>
    <div id="loadbar"><div id="loadfill"></div></div>
  </header>

  <main id="chat"></main>

  <form id="form">
    <textarea id="input" placeholder="Ask something… (Enter = send)" disabled></textarea>
    <button id="send" type="submit" disabled>Send</button>
    <button id="clear" type="button">Clear</button>
  </form>

  <script type="module" src="app.js?v=4132892343183348224"></script>
</body>
</html>
